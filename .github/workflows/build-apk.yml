name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Create fixed debug keystore
        run: |
          keytool -genkeypair \
            -keystore tvtimeleap.keystore \
            -storepass tvtimeleap123 \
            -keypass tvtimeleap123 \
            -alias tvtimeleap \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=TV Time Leap, OU=TV Time Leap, O=TV Time Leap, L=Antakya, ST=Hatay, C=TR"

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Sign APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks tvtimeleap.keystore \
            --ks-key-alias tvtimeleap \
            --ks-pass pass:tvtimeleap123 \
            --key-pass pass:tvtimeleap123 \
            --out TV-Time-Leap.apk \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose TV-Time-Leap.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Time-Leap-APK
          path: TV-Time-Leap.apk
          compression-level: 0
